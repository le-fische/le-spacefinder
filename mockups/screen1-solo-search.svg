<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 1020" width="560" height="1020" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Helvetica Neue', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EEF2F9"/>
      <stop offset="100%" stop-color="#E2E8F4"/>
    </linearGradient>
    <filter id="phoneShadow" x="-10%" y="-5%" width="120%" height="112%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#0F172A" flood-opacity="0.18"/>
    </filter>
    <filter id="cardShadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#0F172A" flood-opacity="0.05"/>
    </filter>
    <clipPath id="screenClip">
      <rect x="65" y="40" width="430" height="920" rx="48"/>
    </clipPath>
  </defs>

  <!-- Subtle Backdrop -->
  <rect width="560" height="1020" fill="url(#bg)"/>

  <!-- iPhone Outer Titanium Bezel -->
  <rect x="53" y="28" width="454" height="944" rx="58" fill="#1C1C1E" filter="url(#phoneShadow)"/>
  <rect x="56" y="31" width="448" height="938" rx="55" fill="#2C2C2E"/>
  <rect x="61" y="36" width="438" height="928" rx="51" fill="#000000"/>

  <!-- Side Hardware Buttons -->
  <rect x="50" y="180" width="3" height="32" rx="1.5" fill="#3A3A3C"/>
  <rect x="50" y="232" width="3" height="60" rx="1.5" fill="#3A3A3C"/>
  <rect x="50" y="304" width="3" height="60" rx="1.5" fill="#3A3A3C"/>
  <rect x="507" y="250" width="3" height="84" rx="1.5" fill="#3A3A3C"/>

  <!-- iOS Screen Canvas -->
  <g clip-path="url(#screenClip)">
    <rect x="65" y="40" width="430" height="920" fill="#F2F2F7"/>

    <!-- iOS Status Bar -->
    <text x="108" y="73" fill="#000000" font-size="15" font-weight="600">9:41</text>
    <!-- Dynamic Island -->
    <rect x="220" y="52" width="120" height="32" rx="16" fill="#000000"/>
    <!-- Status Icons (Signal, WiFi, Battery) -->
    <rect x="415" y="64" width="3" height="6" rx="1" fill="#000000"/>
    <rect x="420" y="62" width="3" height="8" rx="1" fill="#000000"/>
    <rect x="425" y="59" width="3" height="11" rx="1" fill="#000000"/>
    <rect x="430" y="56" width="3" height="14" rx="1" fill="#000000"/>
    <rect x="442" y="58" width="24" height="12" rx="3.5" fill="none" stroke="#000000" stroke-width="1.5"/>
    <rect x="444" y="60" width="18" height="8" rx="2" fill="#000000"/>
    <rect x="467" y="61" width="2" height="6" rx="1" fill="#000000"/>

    <!-- App Header -->
    <text x="89" y="118" fill="#002145" font-size="24" font-weight="800" letter-spacing="-0.5">LE SpaceFinder</text>
    <rect x="356" y="99" width="115" height="26" rx="13" fill="#E5E5EA"/>
    <circle cx="368" cy="112" r="4" fill="#8E8E93"/>
    <text x="377" y="116" fill="#3A3A3C" font-size="11" font-weight="600">Not Checked In</text>

    <!-- iOS Segmented Control -->
    <rect x="89" y="136" width="382" height="36" rx="10" fill="#E3E3E8"/>
    <rect x="92" y="139" width="188" height="30" rx="8" fill="#FFFFFF" filter="url(#cardShadow)"/>
    <text x="186" y="159" fill="#000000" font-size="13" font-weight="600" text-anchor="middle">Solo Gap</text>
    <text x="377" y="159" fill="#636366" font-size="13" font-weight="500" text-anchor="middle">Group Meet</text>

    <!-- Input Card (iOS Inset Grouped List Style) -->
    <rect x="89" y="186" width="382" height="252" rx="16" fill="#FFFFFF" filter="url(#cardShadow)"/>

    <!-- Row 1: From Building -->
    <text x="107" y="216" fill="#8E8E93" font-size="11" font-weight="600" letter-spacing="0.4">FROM BUILDING</text>
    <rect x="107" y="223" width="164" height="36" rx="10" fill="#F2F2F7"/>
    <text x="119" y="246" fill="#000000" font-size="13" font-weight="600">KAIS • Kaiser</text>
    <text x="253" y="245" fill="#8E8E93" font-size="12">▾</text>

    <!-- Row 1 Right: To Building -->
    <text x="289" y="216" fill="#8E8E93" font-size="11" font-weight="600" letter-spacing="0.4">NEXT CLASS (TO)</text>
    <rect x="289" y="223" width="164" height="36" rx="10" fill="#F2F2F7"/>
    <text x="301" y="246" fill="#000000" font-size="13" font-weight="600">BUCH • Buchanan</text>
    <text x="435" y="245" fill="#8E8E93" font-size="12">▾</text>

    <!-- Row 2: Day & Gap Window -->
    <text x="107" y="281" fill="#8E8E93" font-size="11" font-weight="600" letter-spacing="0.4">DAY</text>
    <rect x="107" y="288" width="114" height="34" rx="9" fill="#F2F2F7"/>
    <text x="117" y="309" fill="#8E8E93" font-size="12" font-weight="500">M</text>
    <rect x="133" y="291" width="28" height="28" rx="7" fill="#007AFF"/>
    <text x="147" y="309" fill="#FFFFFF" font-size="12" font-weight="700" text-anchor="middle">Tu</text>
    <text x="170" y="309" fill="#8E8E93" font-size="12" font-weight="500">W</text>
    <text x="188" y="309" fill="#8E8E93" font-size="12" font-weight="500">Th</text>
    <text x="208" y="309" fill="#8E8E93" font-size="12" font-weight="500">F</text>

    <text x="235" y="281" fill="#8E8E93" font-size="11" font-weight="600" letter-spacing="0.4">GAP START</text>
    <rect x="235" y="288" width="102" height="34" rx="9" fill="#F2F2F7"/>
    <text x="249" y="310" fill="#000000" font-size="13" font-weight="600">11:00 AM</text>
    <text x="321" y="309" fill="#8E8E93" font-size="11">▾</text>

    <text x="351" y="281" fill="#8E8E93" font-size="11" font-weight="600" letter-spacing="0.4">GAP END</text>
    <rect x="351" y="288" width="102" height="34" rx="9" fill="#F2F2F7"/>
    <text x="365" y="310" fill="#000000" font-size="13" font-weight="600">12:30 PM</text>
    <text x="437" y="309" fill="#8E8E93" font-size="11">▾</text>

    <!-- Row 3: Filter Chips -->
    <rect x="107" y="336" width="106" height="30" rx="15" fill="#E5F1FF" stroke="#007AFF" stroke-width="1.2"/>
    <text x="160" y="355" fill="#007AFF" font-size="12" font-weight="600" text-anchor="middle">⚡ Outlets</text>

    <rect x="221" y="336" width="116" height="30" rx="15" fill="#E5F1FF" stroke="#007AFF" stroke-width="1.2"/>
    <text x="279" y="355" fill="#007AFF" font-size="12" font-weight="600" text-anchor="middle">♿ Step-Free</text>

    <rect x="345" y="336" width="108" height="30" rx="15" fill="#F2F2F7"/>
    <text x="399" y="355" fill="#636366" font-size="12" font-weight="500" text-anchor="middle">🖍️ Whiteboard</text>

    <!-- Primary CTA Button -->
    <rect x="107" y="380" width="346" height="44" rx="12" fill="#007AFF"/>
    <text x="280" y="407" fill="#FFFFFF" font-size="15" font-weight="600" text-anchor="middle">Find Available Classrooms</text>

    <!-- Results Section Header -->
    <text x="93" y="464" fill="#636366" font-size="12" font-weight="700" letter-spacing="0.5">3 ROOMS FREE • INCL. 10M CLASS BUFFER</text>

    <!-- Result Card 1 (Best Match) -->
    <rect x="89" y="476" width="382" height="122" rx="16" fill="#FFFFFF" stroke="#007AFF" stroke-width="1.8" filter="url(#cardShadow)"/>
    <text x="109" y="506" fill="#000000" font-size="18" font-weight="700">MCLD 202</text>
    <rect x="210" y="489" width="128" height="22" rx="11" fill="#E8F8EE"/>
    <circle cx="222" cy="500" r="4" fill="#34C759"/>
    <text x="232" y="504" fill="#1E7E34" font-size="11" font-weight="700">Free until 14:00</text>
    <text x="448" y="507" fill="#C7C7CC" font-size="20" font-weight="600">›</text>

    <text x="109" y="529" fill="#3A3A3C" font-size="13" font-weight="500">MacLeod Bldg • 2m from KAIS, 6m to BUCH</text>
    <text x="109" y="549" fill="#007AFF" font-size="12" font-weight="600">🚶 +1 min detour  •  🔒 Locks 21:00</text>

    <line x1="109" y1="562" x2="451" y2="562" stroke="#F2F2F7" stroke-width="1"/>
    <text x="109" y="582" fill="#636366" font-size="12" font-weight="500">👥 4 / 40 Checked In (Quiet)   •   ⚡ Outlets   •   ♿ Step-Free</text>

    <!-- Result Card 2 -->
    <rect x="89" y="612" width="382" height="122" rx="16" fill="#FFFFFF" filter="url(#cardShadow)"/>
    <text x="109" y="642" fill="#000000" font-size="18" font-weight="700">BUCH A202</text>
    <rect x="220" y="625" width="128" height="22" rx="11" fill="#E8F8EE"/>
    <circle cx="232" cy="636" r="4" fill="#34C759"/>
    <text x="242" y="640" fill="#1E7E34" font-size="11" font-weight="700">Free until 13:00</text>
    <text x="448" y="643" fill="#C7C7CC" font-size="20" font-weight="600">›</text>

    <text x="109" y="665" fill="#3A3A3C" font-size="13" font-weight="500">Buchanan Bldg • 7m from KAIS, 0m to BUCH</text>
    <text x="109" y="685" fill="#007AFF" font-size="12" font-weight="600">🚶 +0 min detour (Next class bldg)  •  🔒 Locks 22:00</text>

    <line x1="109" y1="698" x2="451" y2="698" stroke="#F2F2F7" stroke-width="1"/>
    <text x="109" y="718" fill="#636366" font-size="12" font-weight="500">👥 14 / 35 Checked In (40%)   •   ⚡ Outlets   •   ♿ Step-Free</text>

    <!-- Result Card 3 -->
    <rect x="89" y="748" width="382" height="122" rx="16" fill="#FFFFFF" filter="url(#cardShadow)"/>
    <text x="109" y="778" fill="#000000" font-size="18" font-weight="700">ICCS 204</text>
    <rect x="202" y="761" width="128" height="22" rx="11" fill="#E8F8EE"/>
    <circle cx="214" cy="772" r="4" fill="#34C759"/>
    <text x="224" y="776" fill="#1E7E34" font-size="11" font-weight="700">Free until 13:30</text>
    <text x="448" y="779" fill="#C7C7CC" font-size="20" font-weight="600">›</text>

    <text x="109" y="801" fill="#3A3A3C" font-size="13" font-weight="500">ICICS / CS Bldg • 3m from KAIS, 9m to BUCH</text>
    <text x="109" y="821" fill="#636366" font-size="12" font-weight="600">🚶 +4 min detour  •  🔒 Locks 21:30</text>

    <line x1="109" y1="834" x2="451" y2="834" stroke="#F2F2F7" stroke-width="1"/>
    <text x="109" y="854" fill="#636366" font-size="12" font-weight="500">👥 3 / 50 Checked In (Quiet)   •   ⚡ Outlets   •   🖍️ Board</text>

    <!-- Subtle hint banner at bottom -->
    <text x="280" y="905" fill="#8E8E93" font-size="12" font-weight="500" text-anchor="middle">Tap any classroom card to view schedule &amp; check in</text>

    <!-- iOS Home Indicator -->
    <rect x="210" y="944" width="140" height="5" rx="2.5" fill="#000000"/>
  </g>

  <!-- Caption Footer -->
  <text x="280" y="998" fill="#475569" font-size="13" font-weight="600" text-anchor="middle">Screen 1 — Solo Gap Finder &amp; Corridor Results (iOS View)</text>
</svg>
