<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 1020" width="560" height="1020" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Helvetica Neue', sans-serif">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EEF2F9"/>
      <stop offset="100%" stop-color="#E2E8F4"/>
    </linearGradient>
    <filter id="phoneShadow2" x="-10%" y="-5%" width="120%" height="112%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#0F172A" flood-opacity="0.18"/>
    </filter>
    <filter id="cardShadow2" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#0F172A" flood-opacity="0.05"/>
    </filter>
    <clipPath id="screenClip2">
      <rect x="65" y="40" width="430" height="920" rx="48"/>
    </clipPath>
  </defs>

  <!-- Subtle Backdrop -->
  <rect width="560" height="1020" fill="url(#bg2)"/>

  <!-- iPhone Outer Titanium Bezel -->
  <rect x="53" y="28" width="454" height="944" rx="58" fill="#1C1C1E" filter="url(#phoneShadow2)"/>
  <rect x="56" y="31" width="448" height="938" rx="55" fill="#2C2C2E"/>
  <rect x="61" y="36" width="438" height="928" rx="51" fill="#000000"/>

  <!-- Side Hardware Buttons -->
  <rect x="50" y="180" width="3" height="32" rx="1.5" fill="#3A3A3C"/>
  <rect x="50" y="232" width="3" height="60" rx="1.5" fill="#3A3A3C"/>
  <rect x="50" y="304" width="3" height="60" rx="1.5" fill="#3A3A3C"/>
  <rect x="507" y="250" width="3" height="84" rx="1.5" fill="#3A3A3C"/>

  <!-- iOS Screen Canvas -->
  <g clip-path="url(#screenClip2)">
    <!-- Dimmed Background Screen (Screen 1 behind modal sheet) -->
    <rect x="65" y="40" width="430" height="920" fill="#1C1C1E"/>
    <rect x="83" y="96" width="394" height="60" rx="16" fill="#2C2C2E"/>

    <!-- iOS Status Bar (Light text over dark backdrop) -->
    <text x="108" y="73" fill="#FFFFFF" font-size="15" font-weight="600">9:41</text>
    <rect x="220" y="52" width="120" height="32" rx="16" fill="#000000"/>
    <rect x="415" y="64" width="3" height="6" rx="1" fill="#FFFFFF"/>
    <rect x="420" y="62" width="3" height="8" rx="1" fill="#FFFFFF"/>
    <rect x="425" y="59" width="3" height="11" rx="1" fill="#FFFFFF"/>
    <rect x="430" y="56" width="3" height="14" rx="1" fill="#FFFFFF"/>
    <rect x="442" y="58" width="24" height="12" rx="3.5" fill="none" stroke="#FFFFFF" stroke-width="1.5"/>
    <rect x="444" y="60" width="18" height="8" rx="2" fill="#FFFFFF"/>

    <!-- iOS Bottom Sheet Modal -->
    <rect x="65" y="114" width="430" height="846" rx="34" fill="#F2F2F7"/>

    <!-- Sheet Grabber Bar -->
    <rect x="256" y="124" width="48" height="5" rx="2.5" fill="#C7C7CC"/>

    <!-- Sheet Header -->
    <text x="91" y="166" fill="#000000" font-size="24" font-weight="800" letter-spacing="-0.4">MCLD 202</text>
    <text x="91" y="187" fill="#636366" font-size="13" font-weight="500">MacLeod Building • 40 Seats • Locks at 21:00</text>
    <circle cx="452" cy="162" r="16" fill="#E5E5EA"/>
    <text x="452" y="167" fill="#636366" font-size="14" font-weight="700" text-anchor="middle">✕</text>

    <!-- Status & Amenity Pills -->
    <rect x="91" y="204" width="136" height="28" rx="14" fill="#E8F8EE"/>
    <circle cx="105" cy="218" r="4" fill="#34C759"/>
    <text x="115" y="222" fill="#1E7E34" font-size="12" font-weight="700">Free 11:00–14:00</text>

    <rect x="235" y="204" width="84" height="28" rx="14" fill="#E5F1FF"/>
    <text x="277" y="222" fill="#007AFF" font-size="12" font-weight="600" text-anchor="middle">⚡ Outlets</text>

    <rect x="327" y="204" width="96" height="28" rx="14" fill="#E5F1FF"/>
    <text x="375" y="222" fill="#007AFF" font-size="12" font-weight="600" text-anchor="middle">♿ Step-Free</text>

    <rect x="431" y="204" width="38" height="28" rx="14" fill="#E5F1FF"/>
    <text x="450" y="222" fill="#007AFF" font-size="12" font-weight="600" text-anchor="middle">🖍️</text>

    <!-- Card 1: Daily Schedule Timeline -->
    <rect x="89" y="248" width="382" height="156" rx="16" fill="#FFFFFF" filter="url(#cardShadow2)"/>
    <text x="109" y="274" fill="#8E8E93" font-size="11" font-weight="700" letter-spacing="0.5">TODAY'S ROOM SCHEDULE (08:00 – 21:00)</text>

    <!-- Timeline Segmented Bar -->
    <!-- 08:00-11:00 Booked -->
    <rect x="109" y="290" width="82" height="44" rx="8" fill="#E5E5EA"/>
    <text x="150" y="310" fill="#636366" font-size="10" font-weight="700" text-anchor="middle">CPEN 211</text>
    <text x="150" y="324" fill="#8E8E93" font-size="9" font-weight="500" text-anchor="middle">08:00–11:00</text>

    <!-- 11:00-12:30 Your Gap -->
    <rect x="194" y="286" width="84" height="52" rx="9" fill="#007AFF"/>
    <text x="236" y="309" fill="#FFFFFF" font-size="10" font-weight="800" text-anchor="middle">YOUR GAP</text>
    <text x="236" y="323" fill="#E5F1FF" font-size="9" font-weight="600" text-anchor="middle">11:00–12:30</text>

    <!-- 12:30-13:50 Extra Free -->
    <rect x="281" y="290" width="66" height="44" rx="8" fill="#E8F8EE" stroke="#34C759" stroke-width="1"/>
    <text x="314" y="310" fill="#1E7E34" font-size="10" font-weight="700" text-anchor="middle">Open</text>
    <text x="314" y="324" fill="#1E7E34" font-size="9" font-weight="500" text-anchor="middle">to 13:50</text>

    <!-- 13:50-14:00 10m Buffer -->
    <rect x="350" y="290" width="14" height="44" rx="4" fill="#FF9500"/>

    <!-- 14:00-17:00 Booked -->
    <rect x="367" y="290" width="84" height="44" rx="8" fill="#E5E5EA"/>
    <text x="409" y="310" fill="#636366" font-size="10" font-weight="700" text-anchor="middle">ELEC 201</text>
    <text x="409" y="324" fill="#8E8E93" font-size="9" font-weight="500" text-anchor="middle">14:00–17:00</text>

    <!-- Buffer Legend -->
    <rect x="109" y="350" width="10" height="10" rx="3" fill="#FF9500"/>
    <text x="125" y="359" fill="#636366" font-size="11" font-weight="500">13:50–14:00: Mandatory 10-min pre-class vacate buffer</text>
    <text x="109" y="382" fill="#1E7E34" font-size="12" font-weight="600">✓ Guaranteed 1h 30m uninterrupted study + 1h 20m buffer</text>

    <!-- Card 2: Live Occupancy -->
    <rect x="89" y="418" width="382" height="106" rx="16" fill="#FFFFFF" filter="url(#cardShadow2)"/>
    <text x="109" y="444" fill="#8E8E93" font-size="11" font-weight="700" letter-spacing="0.5">LIVE STUDENT OCCUPANCY</text>
    <text x="109" y="468" fill="#000000" font-size="16" font-weight="700">4 / 40 Checked In</text>
    <text x="378" y="468" fill="#34C759" font-size="13" font-weight="700">10% • Quiet</text>

    <!-- Progress Bar -->
    <rect x="109" y="482" width="342" height="10" rx="5" fill="#E5E5EA"/>
    <rect x="109" y="482" width="44" height="10" rx="5" fill="#34C759"/>
    <text x="109" y="510" fill="#8E8E93" font-size="11" font-weight="500">Load-balanced across nearby rooms to prevent crowding</text>

    <!-- Card 3: UBC Classroom Usage Guidelines -->
    <rect x="89" y="538" width="382" height="156" rx="16" fill="#FFFFFF" filter="url(#cardShadow2)"/>
    <text x="109" y="564" fill="#007AFF" font-size="11" font-weight="700" letter-spacing="0.5">📋 UBC CLASSROOM USAGE GUIDELINES</text>

    <text x="109" y="590" fill="#1C1C1E" font-size="13" font-weight="500">• Vacate immediately if an instructor or booking arrives</text>
    <text x="109" y="616" fill="#1C1C1E" font-size="13" font-weight="500">• Return desks &amp; chairs to posted layout; erase boards</text>
    <text x="109" y="642" fill="#1C1C1E" font-size="13" font-weight="500">• Spill-proof drinks only; pack waste to hallway stations</text>
    <text x="109" y="668" fill="#1C1C1E" font-size="13" font-weight="500">• Respect scent-free policy &amp; 21:00 MacLeod lock-up</text>

    <!-- Bottom Action Buttons -->
    <rect x="89" y="714" width="382" height="52" rx="14" fill="#34C759" filter="url(#cardShadow2)"/>
    <text x="280" y="746" fill="#FFFFFF" font-size="16" font-weight="700" text-anchor="middle">✓  Check In to MCLD 202</text>

    <rect x="89" y="778" width="382" height="48" rx="14" fill="#FFF8EB" stroke="#FF9500" stroke-width="1.5"/>
    <text x="280" y="807" fill="#B25000" font-size="14" font-weight="600" text-anchor="middle">🔒  Report Room Locked or In Use</text>

    <text x="280" y="852" fill="#8E8E93" font-size="11" font-weight="500" text-anchor="middle">Check-ins auto-expire at Gap End (12:30 PM) or on Check Out</text>

    <!-- iOS Home Indicator -->
    <rect x="210" y="944" width="140" height="5" rx="2.5" fill="#000000"/>
  </g>

  <!-- Caption Footer -->
  <text x="280" y="998" fill="#475569" font-size="13" font-weight="600" text-anchor="middle">Screen 2 — Room Detail Timeline &amp; Live Check-In Sheet (iOS View)</text>
</svg>
